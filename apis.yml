name: LSI
description: 'LSI Corporation (formerly LSI Logic) was a semiconductor and storage-technology
  company that designed custom and standard chips, storage adapters, and RAID controllers
  for enterprise storage and networking systems. It was a Kleiner Perkins hardtech
  portfolio company and later a public company (NYSE: LSI). LSI was acquired by Avago
  Technologies in 2014 and its assets are now part of Broadcom Inc.; the legacy lsi.com
  domain redirects into Broadcom infrastructure. LSI operated no independent public
  developer program or web API, and no LSI-branded API surface exists today.'
